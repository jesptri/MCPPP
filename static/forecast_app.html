<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteo France Forecast</title>
  <style>
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f5f5;
      --color-text-primary: #171717;
      --color-text-secondary: #6b7280;
      --color-border-primary: #e5e7eb;
      --font-sans: system-ui, -apple-system, sans-serif;
      --border-radius-md: 8px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      padding: 16px;
    }

    .card {
      background: var(--color-background-secondary);
      border: 1px solid var(--color-border-primary);
      border-radius: var(--border-radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .status {
      color: var(--color-text-secondary);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
    }

    .forecast-item {
      background: var(--color-background-primary);
      border: 1px solid var(--color-border-primary);
      border-radius: var(--border-radius-md);
      padding: 10px;
      text-align: center;
    }

    .forecast-item .time {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }

    .forecast-item .temp {
      font-size: 20px;
      font-weight: 600;
    }

    .forecast-item .desc {
      font-size: 11px;
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    #loading {
      text-align: center;
      color: var(--color-text-secondary);
      padding: 24px;
    }

    #error {
      display: none;
      color: #dc2626;
      padding: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1 id="title">Meteo France</h1>
    </div>
    <div id="loading" class="status">Waiting for forecast data...</div>
    <div id="error"></div>
    <div id="forecast-container" class="forecast-grid" style="display:none;"></div>
  </div>

  <script>
    // --- MCP Apps postMessage protocol (steps 4-5 will activate this) ---
    // For now the widget shows the "waiting" state.
    // The handshake and data reception will be implemented in steps 4 & 5.
  </script>
</body>
</html>
